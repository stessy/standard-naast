name: Build macOS Intel installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: macOS Intel DMG
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash .github/scripts/publish-release.sh --validate-tag

      - name: Set up Java 25 x64
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: maven
          cache-dependency-path: standardnaast-backend/pom.xml

      - name: Set up Node.js x64
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          architecture: x64
          cache: npm
          cache-dependency-path: standardnaast-ng/package-lock.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
          run_install: false

      - name: Verify macOS Intel packaging tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -s)" != Darwin || "$(uname -m)" != x86_64 ]]; then
            echo "A macOS Intel runner is required." >&2
            exit 1
          fi
          if [[ "$(node -p 'process.arch')" != x64 ]]; then
            echo "An x64 Node.js installation is required." >&2
            exit 1
          fi
          java -XshowSettings:properties -version 2>&1 | grep -Eq 'os\.arch = (x86_64|amd64)'
          for tool in java jpackage mvn node pnpm hdiutil; do
            command -v "$tool"
          done
          java -version
          jpackage --version
          mvn --version

      - name: Install locked Angular dependencies
        working-directory: standardnaast-ng
        run: npm ci --no-audit --no-fund

      - name: Build and test macOS installer
        run: bash ./build-desktop.sh dmg

      - name: Verify installer output
        shell: bash
        run: |
          set -euo pipefail
          installer="dist-desktop/Standard Naast-1.1.0.dmg"
          test -s "$installer"
          hdiutil verify "$installer"
          shasum -a 256 "$installer"

      - name: Upload macOS Intel installer
        uses: actions/upload-artifact@v4
        with:
          name: standard-naast-macos-intel-dmg
          path: dist-desktop/Standard Naast-1.1.0.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Java test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-java-test-reports
          path: standardnaast-backend/target/surefire-reports/
          retention-days: 14

  release:
    name: Publish macOS installer
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: standard-naast-macos-intel-dmg
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash .github/scripts/publish-release.sh "release-assets/Standard Naast-1.1.0.dmg"
