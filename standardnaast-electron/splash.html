<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Standard de Naast</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #b91c1c; /* Rouge Standard de Naast */
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-app-region: drag;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .logo-container {
      margin-bottom: 20px;
      text-align: center;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      opacity: 0.85;
    }
    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fbbf24; /* Jaune or */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 15px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 13px;
      margin-top: 10px;
      color: #fef3c7;
      text-align: center;
      max-width: 80%;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="title">Standard de Naast</div>
    <div class="subtitle">Chargement de l'application...</div>
  </div>
  <div class="loader"></div>
  <div class="status-text" id="status">Initialisation...</div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash-status', (event, message) => {
      document.getElementById('status').innerText = message;
    });
  </script>
</body>
</html>
