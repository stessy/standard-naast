<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Premier administrateur</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 28px; color: #222; }
    h1 { font-size: 22px; color: #991b1b; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, button { padding: 10px; font: inherit; }
    button { background: #991b1b; color: white; border: none; cursor: pointer; }
    #error { color: #991b1b; min-height: 24px; }
  </style>
</head>
<body>
  <h1>Créer le premier administrateur</h1>
  <p>Cette base ne contient aucun compte de connexion. Choisissez vos identifiants pour accéder à l'application.</p>
  <form id="setup">
    <label for="username">Identifiant</label>
    <input id="username" autocomplete="username" minlength="3" maxlength="50" required autofocus>
    <label for="password">Mot de passe (8 caractères minimum)</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirmation">Confirmer le mot de passe</label>
    <input id="confirmation" type="password" autocomplete="new-password" minlength="8" required>
    <div id="error" role="alert"></div>
    <button type="submit">Créer le compte administrateur</button>
  </form>
  <script src="admin-setup-renderer.js"></script>
</body>
</html>
